DO_ETHERNET_TEST=N
DO_WIFI_TEST=N
DO_BT_TEST=N
DO_UART_TEST=N
DO_UART_to_UART_TEST=N
DO_NPU_TEST=Y
DO_CAN_TEST=N
DO_AUDIO_TEST=N
DO_AUDIOAMP_TEST=N
DO_SD_TEST=N
DO_EEPROM_TEST=Y
DO_USBBRIDGE_EEPROM_TEST=Y
DO_I2C5_EEPROM_TEST=Y
DO_LTE_CHECK=N
DO_THERMAL_LOGGING=N
DO_RTC_TEST=Y
DO_MODEM_TEST=N
DO_SIM_TEST=N
DO_LT9211_TEST=N
DO_LED_TEST=N
DO_USBCC_TEST=N
